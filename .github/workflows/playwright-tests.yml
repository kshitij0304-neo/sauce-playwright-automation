name: Java Playwright CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-browser-tests:
    name: Cross-browser automation tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      HEADLESS: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Set up Node.js for Allure
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Check Java and Maven versions
        run: |
          java --version
          mvn --version

      - name: Install Playwright browsers and Linux dependencies
        run: >
          mvn -B -ntp exec:java -e
          -D exec.mainClass=com.microsoft.playwright.CLI
          -D exec.args="install --with-deps"

      - name: Run cross-browser TestNG suite
        run: mvn -B -ntp clean test
      - name: Generate Allure HTML report
        if: ${{ always() }}
        shell: bash
        run: |
          if [ -d target/allure-results ] && \
             find target/allure-results -type f -name '*-result.json' -print -quit | grep -q .; then
            npx --yes allure@3.20.1 generate target/allure-results
          else
            echo "No Allure test results found; skipping report generation."
          fi
      - name: Upload test reports and debugging artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-ci-artifacts-${{ github.run_number }}
          path: |
            target/surefire-reports/
            target/allure-results/
            allure-report/
            test-output/logs/
            test-output/screenshots/
            test-output/traces/
          if-no-files-found: warn
          retention-days: 14